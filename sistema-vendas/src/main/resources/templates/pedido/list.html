<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos Registrados</title>
    <!-- Importação do CSS do Bootstrap -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container-fluid mt-5 px-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-11">
            
            <div class="card shadow-sm border-0">
                <!-- Cabeçalho escuro igual ao da sua imagem -->
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                    <h4 class="mb-0">
                        <i class="bi bi-list-check me-2"></i>Pedidos Registrados
                    </h4>
                    <a th:href="@{/pedidos/novo}" class="btn btn-success fw-bold shadow-sm">
                        <i class="bi bi-plus-lg me-1"></i> Registrar Pedido
                    </a>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle text-center mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Data e Hora</th>
                                    <th>Status</th>
                                    <th>Valor Total</th>
                                    <th>Qtd. Itens</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Loop pelos pedidos -->
                                <tr th:each="pedido : ${pedidos}">
                                    <td class="fw-bold text-secondary" th:text="${pedido.id}"></td>
                                    
                                    <td class="fw-medium text-start px-4" th:text="${pedido.cliente.nome}"></td>
                                    
                                    <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
                                    
                                    <!-- Badge de Status Dinâmico -->
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${pedido.status.name() == 'ATIVO' ? 'bg-success' : 'bg-danger'}" 
                                              th:text="${pedido.status}">
                                        </span>
                                    </td>
                                    
                                    <td class="fw-bold text-success" th:text="|R$ ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}|"></td>
                                    
                                    <td>
                                        <span class="badge bg-secondary rounded-pill fs-6 px-3" th:text="${#lists.size(pedido.itens)}"></span>
                                    </td>
                                    
                                    <!-- Botões de Ação -->
                                    <td>
                                        <div class="d-flex justify-content-center gap-2">
                                            <!-- Ver Detalhes (Disponível sempre) -->
                                            <a th:href="@{/pedidos/detalhes/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-info shadow-sm" title="Ver Detalhes">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            
                                            <!-- Editar (Apenas se ATIVO) -->
                                            <a th:if="${pedido.status.name() == 'ATIVO'}" th:href="@{/pedidos/edit/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-warning shadow-sm text-dark" title="Editar Pedido">
                                                <i class="bi bi-pencil"></i>
                                            </a>

                                            <!-- Cancelar (A Lixeira - Redireciona para tela de confirmação de cancelamento) -->
                                            <a th:if="${pedido.status.name() == 'ATIVO'}" th:href="@{/pedidos/cancelar/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-danger shadow-sm" title="Cancelar Pedido">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                
                                <!-- Mensagem caso não existam pedidos -->
                                <tr th:if="${#lists.isEmpty(pedidos)}">
                                    <td colspan="7" class="text-muted py-5">
                                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                        Nenhum pedido registrado no sistema ainda.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Botão extra para voltar à navegação principal (Opcional) -->
            <div class="mt-3">
                <a th:href="@{/clientes}" class="btn btn-link text-decoration-none">Ir para Clientes</a> |
                <a th:href="@{/produtos}" class="btn btn-link text-decoration-none">Ir para Produtos</a>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
