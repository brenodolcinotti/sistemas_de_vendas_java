<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pedidos</title>
    <!-- Importando o CSS do Bootstrap nativo do projeto -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container-fluid mt-5 px-4">
    <div class="row justify-content-center">
        <div class="col-lg-11">
            
            <!-- Alerta de Sucesso -->
            <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${mensagem}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                    <h3 class="mb-0">
                        <i class="bi bi-card-list me-2"></i>Pedidos Registrados
                    </h3>
                    <a th:href="@{/pedidos/novo}" class="btn btn-success fw-bold shadow-sm">
                        <i class="bi bi-plus-lg me-1"></i> Registrar Pedido
                    </a>
                </div>
                
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-secondary">
                                <tr>
                                    <th scope="col" class="px-4">ID</th>
                                    <th scope="col">Cliente</th>
                                    <th scope="col">Data e Hora</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Valor Total</th>
                                    <th scope="col" class="text-center">Qtd. Itens</th>
                                    <th scope="col" class="text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="pedido : ${pedidos}">
                                    <!-- ID do Pedido -->
                                    <td class="px-4 font-monospace fw-bold text-muted" th:text="${pedido.id}"></td>
                                    
                                    <!-- Nome do Cliente -->
                                    <td class="fw-medium" th:text="${pedido.cliente.nome}"></td>
                                    
                                    <!-- Data Formatada (Padrão BR) -->
                                    <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
                                    
                                    <!-- Status com Etiqueta Colorida -->
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${pedido.status.name() == 'ATIVO' ? 'bg-success' : 'bg-danger'}" 
                                              th:text="${pedido.status}">
                                        </span>
                                    </td>
                                    
                                    <!-- Valor Total Formatado -->
                                    <td class="fw-bold text-success" th:text="|R$ ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}|"></td>
                                    
                                    <!-- Quantidade de Itens (Tamanho da Lista) -->
                                    <td class="text-center">
                                        <span class="badge bg-secondary rounded-pill" th:text="${#lists.size(pedido.itens)}"></span>
                                    </td>
                                    
                                    <!-- Coluna de Ações (Botão Excluir) -->
                                    <td class="text-center">
                                        <a th:href="@{/pedidos/deletar/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-danger" title="Excluir Pedido">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                                
                                <!-- Mensagem caso não exista nenhum pedido -->
                                <tr th:if="${#lists.isEmpty(pedidos)}">
                                    <td colspan="7" class="text-center py-4 text-muted">
                                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                        Nenhum pedido registrado no sistema ainda.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Importando o JS do Bootstrap -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
