<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Pedido</title>
    <!-- Importando o CSS do Bootstrap nativo -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"><i class="bi bi-cart-plus me-2"></i>Registrar Novo Pedido</h3>
        </div>
        
        <div class="card-body p-4">
            <form th:action="@{/pedidos}" method="post">
                
                <!-- 1. Seleção de Cliente -->
                <div class="mb-4">
                    <label for="cliente" class="form-label fw-bold">Selecione o Cliente <span class="text-danger">*</span></label>
                    <select class="form-select" id="cliente" name="cliente.id" required>
                        <option value="">Selecione um cliente...</option>
                        <!-- O Controller precisará enviar a lista 'clientes' -->
                        <option th:each="cliente : ${clientes}" 
                                th:value="${cliente.id}" 
                                th:text="${cliente.nome} + ' (CPF: ' + ${cliente.cpf} + ')'">
                        </option>
                    </select>
                </div>

                <!-- 2. Lista de Produtos -->
                <h5 class="text-secondary mb-3 border-bottom pb-2">Itens do Pedido</h5>
                <p class="text-muted small">Adicione a quantidade desejada. Os produtos com quantidade "0" serão ignorados. O valor total será calculado automaticamente.</p>
                
                <div class="table-responsive mb-4">
                    <table class="table table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Produto</th>
                                <th>Preço Unitário</th>
                                <th>Estoque Disponível</th>
                                <th style="width: 150px;">Quantidade</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- O Controller precisará enviar a lista 'produtos' -->
                            <tr th:each="produto, stat : ${produtos}">
                                <td class="fw-bold" th:text="${produto.nome}"></td>
                                <td th:text="|R$ ${produto.preco}|"></td>
                                <td th:text="${produto.estoque}"></td>
                                <td>
                                    <!-- Input oculto para enviar qual é o Produto -->
                                    <input type="hidden" th:name="|itens[${stat.index}].produto.id|" th:value="${produto.id}" />
                                    
                                    <!-- Input de Quantidade (O max="${produto.estoque}" impede de pedir mais do que tem) -->
                                    <input type="number" 
                                           th:name="|itens[${stat.index}].quantidade|" 
                                           class="form-control text-center" 
                                           min="0" 
                                           th:max="${produto.estoque}" 
                                           value="0" />
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Botões de Ação -->
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/pedidos}" class="btn btn-outline-secondary px-4 fw-bold">Cancelar</a>
                    <button type="submit" class="btn btn-success px-4 fw-bold">
                        <i class="bi bi-check-circle-fill me-1"></i> Confirmar Pedido
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
