<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Pedido</title>
    <!-- Importação do CSS do Bootstrap -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 border-top border-4 border-success">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 text-success"><i class="bi bi-cart-plus me-2"></i>Iniciar Novo Pedido</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-4">Selecione o cliente para o qual deseja criar o pedido. No próximo passo, poderá adicionar os produtos à encomenda.</p>
                    
                    <!-- O formulário envia o clienteId para a action /pedidos/novo -->
                    <form th:action="@{/pedidos/novo}" method="post">
                        
                        <div class="mb-4">
                            <label for="clienteId" class="form-label fw-bold text-secondary">Cliente <span class="text-danger">*</span></label>
                            
                            <!-- Lista pendente preenchida com os clientes da Base de Dados -->
                            <select class="form-select form-select-lg shadow-sm" id="clienteId" name="clienteId" required>
                                <option value="">Selecione um cliente...</option>
                                <option th:each="cliente : ${clientes}" 
                                        th:value="${cliente.id}" 
                                        th:text="${cliente.nome} + ' (CPF: ' + ${cliente.cpf} + ')'">
                                </option>
                            </select>
                            
                            <div th:if="${#lists.isEmpty(clientes)}" class="form-text text-danger mt-2">
                                <i class="bi bi-exclamation-triangle"></i> Não existem clientes registados. Registe um cliente primeiro.
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2 mt-2">
                            <a th:href="@{/pedidos}" class="btn btn-outline-secondary px-4 fw-bold">Cancelar</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold" th:disabled="${#lists.isEmpty(clientes)}">
                                Avançar <i class="bi bi-arrow-right ms-1"></i>
                            </button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
