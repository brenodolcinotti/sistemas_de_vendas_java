<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Pedido</title>
    <!-- Importação do CSS do Bootstrap -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container-fluid mt-5 px-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-11">
            
            <!-- Resumo do Pedido no Topo -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                    <h4 class="mb-0">
                        <i class="bi bi-cart-check me-2"></i>A Editar Pedido #<span th:text="${pedido.id}"></span>
                    </h4>
                    <span class="badge bg-light text-primary fs-6">
                        Total: <span th:text="|R$ ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}|"></span>
                    </span>
                </div>
                <div class="card-body bg-light">
                    <div class="row">
                        <div class="col-md-4">
                            <p class="mb-1 text-muted small">Cliente</p>
                            <h6 class="fw-bold" th:text="${pedido.cliente.nome}"></h6>
                        </div>
                        <div class="col-md-4">
                            <p class="mb-1 text-muted small">Data de Criação</p>
                            <h6 th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></h6>
                        </div>
                        <div class="col-md-4">
                            <p class="mb-1 text-muted small">Status</p>
                            <span class="badge bg-success" th:text="${pedido.status}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulário para Adicionar Novo Item -->
            <div class="card shadow-sm border-0 mb-4 border-start border-4 border-success">
                <div class="card-body p-4">
                    <h5 class="text-secondary mb-3"><i class="bi bi-plus-circle me-2"></i>Adicionar Produto</h5>
                    
                    <form th:action="@{/pedidos/{pedidoId}/adicionar-item(pedidoId=${pedido.id})}" method="post" class="row g-3 align-items-end">
                        
                        <div class="col-md-7">
                            <label for="produtoId" class="form-label fw-medium">Selecione o Produto <span class="text-danger">*</span></label>
                            <select class="form-select" id="produtoId" name="produtoId" required>
                                <option value="">Escolha um produto disponível no stock...</option>
                                <!-- Lista de produtos dinâmicos -->
                                <option th:each="p : ${produtos}" 
                                        th:value="${p.id}" 
                                        th:text="${p.nome} + ' - R$ ' + ${p.preco} + ' (' + ${p.quantidadeEmEstoque} + ' em stock)'"
                                        th:disabled="${p.quantidadeEmEstoque == 0}">
                                </option>
                            </select>
                        </div>
                        
                        <div class="col-md-3">
                            <label for="quantidade" class="form-label fw-medium">Quantidade <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="quantidade" name="quantidade" min="1" value="1" required>
                        </div>
                        
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm">
                                <i class="bi bi-cart-plus me-1"></i> Adicionar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabela de Itens Adicionados -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle text-center mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="text-start px-4">Produto</th>
                                    <th>Preço Unitário</th>
                                    <th>Quantidade</th>
                                    <th>Subtotal</th>
                                    <th class="text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${pedido.itens}">
                                    <td class="text-start px-4 fw-medium">
                                        <i class="bi bi-box-seam me-2 text-secondary"></i>
                                        <span th:text="${item.produto.nome}"></span>
                                    </td>
                                    
                                    <td th:text="|R$ ${#numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}|"></td>
                                    
                                    <td>
                                        <span class="badge bg-secondary rounded-pill fs-6 px-3" th:text="${item.quantidade}"></span>
                                    </td>
                                    
                                    <!-- Cálculo do subtotal do item processado no Java -->
                                    <td class="fw-bold text-success" th:text="|R$ ${#numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}|"></td>
                                    
                                    <!-- Ação: Remover Item -->
                                    <td class="text-center">
                                        <form th:action="@{/pedidos/{pedidoId}/remover-item/{itemId}(pedidoId=${pedido.id}, itemId=${item.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-danger shadow-sm" title="Remover item e devolver ao stock">
                                                <i class="bi bi-trash"></i> Remover
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                
                                <tr th:if="${#lists.isEmpty(pedido.itens)}">
                                    <td colspan="5" class="text-muted py-5">
                                        <i class="bi bi-cart-x fs-1 d-block mb-2"></i>
                                        O pedido está vazio. Adicione produtos utilizando o formulário acima.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Rodapé com o botão de Finalização -->
                <div class="card-footer bg-white py-4 px-4 d-flex justify-content-end">
                    <form th:action="@{/pedidos/{id}/finalizar(id=${pedido.id})}" method="post">
                        <!-- Só permite finalizar se houver pelo menos um item no pedido -->
                        <button type="submit" class="btn btn-primary px-5 fw-bold shadow" th:disabled="${#lists.isEmpty(pedido.itens)}">
                            <i class="bi bi-check-circle-fill me-2"></i> Concluir e Guardar Pedido
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
