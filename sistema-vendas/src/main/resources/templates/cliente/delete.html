<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
    <!-- Importando o CSS do Bootstrap nativo do projeto -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Adicionando ícones do Bootstrap (opcional) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            
            <!-- Card de Confirmação -->
            <div class="card shadow-lg border-danger">
                
                <div class="card-header bg-danger text-white text-center py-3">
                    <h4 class="mb-0">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> Confirmar Exclusão
                    </h4>
                </div>
                
                <div class="card-body p-4 text-center">
                    <h5 class="text-danger mb-3">Você tem certeza que deseja excluir este cliente?</h5>
                    <p class="text-muted">Esta ação é <strong>irreversível</strong> e todos os dados vinculados a este registro serão perdidos permanentemente.</p>
                    
                    <!-- Resumo dos dados do cliente para conferência -->
                    <div class="alert alert-light border text-start mt-4 mb-4 shadow-sm">
                        <ul class="list-unstyled mb-0 fs-6">
                            <li class="mb-2"><strong>ID do Sistema:</strong> <span class="font-monospace text-muted" th:text="${cliente.id}"></span></li>
                            <li class="mb-2"><strong>Nome Completo:</strong> <span class="fw-bold" th:text="${cliente.nome}"></span></li>
                            <li class="mb-2"><strong>CPF:</strong> <span class="font-monospace text-muted" th:text="${cliente.cpf}"></span></li>
                            <li><strong>E-mail:</strong> <span th:text="${cliente.email}"></span></li>
                        </ul>
                    </div>
                    
                    <!-- Formulário que executa a exclusão no Backend (POST) -->
                    <form th:action="@{/clientes/deletar/{id}(id=${cliente.id})}" method="post">
                        <div class="d-flex justify-content-center gap-3 mt-4">
                            <!-- Botão para voltar à listagem sem excluir -->
                            <a th:href="@{/clientes}" class="btn btn-outline-secondary px-4 fw-bold">
                                <i class="bi bi-arrow-left me-1"></i> Cancelar
                            </a>
                            <!-- Botão de confirmação destrutiva -->
                            <button type="submit" class="btn btn-danger px-4 fw-bold">
                                <i class="bi bi-trash me-1"></i> Sim, Excluir Cliente
                            </button>
                        </div>
                    </form>
                    
                </div>
            </div>
            
        </div>
    </div>
</div>

<!-- Importando o JS do Bootstrap nativo do projeto -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
