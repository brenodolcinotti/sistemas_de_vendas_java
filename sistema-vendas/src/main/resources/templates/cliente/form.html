<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
    <!-- Importando o CSS do Bootstrap nativo do seu projeto -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Ícones do Bootstrap (opcional) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h3 class="mb-0" th:text="${cliente.id == null} ? 'Novo Cliente' : 'Editar Cliente'">Cadastro de Cliente</h3>
                </div>
                
                <div class="card-body p-4">
                    
                    <!-- Alerta de Erro de Unicidade (Disparado pelo Controller se CPF/Email já existirem) -->
                    <div th:if="${erroUnicidade}" class="alert alert-danger mt-2 mb-4 shadow-sm" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${erroUnicidade}"></span>
                    </div>

                    <form th:action="@{/clientes}" th:object="${cliente}" method="post">
                        <!-- Campo oculto vital para o Spring saber se é um INSERT ou UPDATE -->
                        <input type="hidden" th:field="*{id}" />
                        
                        <h5 class="text-secondary mb-3 border-bottom pb-2">Dados Pessoais</h5>
                        <div class="row mb-4">
                            <!-- Nome -->
                            <div class="col-md-12 mb-3">
                                <label for="nome" class="form-label fw-bold">Nome Completo <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Digite o nome completo" required>
                                <span class="text-danger small fw-bold" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                            </div>
                            
                            <!-- E-mail -->
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label fw-bold">E-mail <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="exemplo@dominio.com" required>
                                <span class="text-danger small fw-bold" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                            </div>
                            
                            <!-- CPF -->
                            <div class="col-md-3 mb-3">
                                <label for="cpf" class="form-label fw-bold">CPF <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="cpf" th:field="*{cpf}" placeholder="000.000.000-00" required>
                                <span class="text-danger small fw-bold" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></span>
                            </div>
                            
                            <!-- Telefone -->
                            <div class="col-md-3 mb-3">
                                <label for="telefone" class="form-label fw-bold">Telefone <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="telefone" th:field="*{telefone}" placeholder="(00) 00000-0000" required>
                                <span class="text-danger small fw-bold" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></span>
                            </div>
                        </div>

                        <h5 class="text-secondary mb-3 border-bottom pb-2">Endereço</h5>
                        <div class="row mb-4">
                            <!-- CEP -->
                            <div class="col-md-3 mb-3">
                                <label for="cep" class="form-label fw-bold">CEP <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="cep" th:field="*{cep}" placeholder="00000-000" required>
                                <span class="text-danger small fw-bold" th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></span>
                            </div>
                            
                            <!-- Logradouro -->
                            <div class="col-md-7 mb-3">
                                <label for="logradouro" class="form-label fw-bold">Logradouro <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="logradouro" th:field="*{logradouro}" placeholder="Rua, Avenida, etc." required>
                                <span class="text-danger small fw-bold" th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></span>
                            </div>
                            
                            <!-- Número (Opcional) -->
                            <div class="col-md-2 mb-3">
                                <label for="numero" class="form-label fw-bold">Número</label>
                                <input type="text" class="form-control" id="numero" th:field="*{numero}" placeholder="S/N">
                                <span class="text-danger small fw-bold" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></span>
                            </div>
                            
                            <!-- Complemento (Opcional) -->
                            <div class="col-md-4 mb-3">
                                <label for="complemento" class="form-label fw-bold">Complemento</label>
                                <input type="text" class="form-control" id="complemento" th:field="*{complemento}" placeholder="Apto, Bloco, etc.">
                                <span class="text-danger small fw-bold" th:if="${#fields.hasErrors('complemento')}" th:errors="*{complemento}"></span>
                            </div>
                            
                            <!-- Bairro -->
                            <div class="col-md-4 mb-3">
                                <label for="bairro" class="form-label fw-bold">Bairro <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="bairro" th:field="*{bairro}" required>
                                <span class="text-danger small fw-bold" th:if="${#fields.hasErrors('bairro')}" th:errors="*{bairro}"></span>
                            </div>
                            
                            <!-- Cidade -->
                            <div class="col-md-3 mb-3">
                                <label for="cidade" class="form-label fw-bold">Cidade <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="cidade" th:field="*{cidade}" required>
                                <span class="text-danger small fw-bold" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></span>
                            </div>
                            
                            <!-- UF -->
                            <div class="col-md-1 mb-3">
                                <label for="uf" class="form-label fw-bold">UF <span class="text-danger">*</span></label>
                                <input type="text" class="form-control text-uppercase" id="uf" th:field="*{uf}" maxlength="2" required>
                                <span class="text-danger small fw-bold" th:if="${#fields.hasErrors('uf')}" th:errors="*{uf}"></span>
                            </div>
                        </div>

                        <!-- Botões de Ação -->
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/clientes}" class="btn btn-outline-secondary px-4 fw-bold">Cancelar</a>
                            <button type="submit" class="btn btn-dark px-4 fw-bold">Salvar Registro</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Importando o JS do Bootstrap nativo do projeto -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
