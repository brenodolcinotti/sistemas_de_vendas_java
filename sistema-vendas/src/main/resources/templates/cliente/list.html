<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <!-- Importando o CSS do Bootstrap nativo do projeto -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Adicionando ícones do Bootstrap (opcional, para os botões) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container-fluid mt-5 px-4">
    <div class="row justify-content-center">
        <div class="col-lg-11">
            
            <!-- Alerta de Sucesso (Exibido ao salvar/excluir cliente) -->
            <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${mensagem}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                    <h3 class="mb-0">
                        <i class="bi bi-people-fill me-2"></i>Clientes Cadastrados
                    </h3>
                    <a th:href="@{/clientes/novo}" class="btn btn-success fw-bold shadow-sm">
                        <i class="bi bi-plus-lg me-1"></i> Cadastrar Novo
                    </a>
                </div>
                
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-secondary">
                                <tr>
                                    <th scope="col" class="px-4">Nome Completo</th>
                                    <th scope="col">E-mail</th>
                                    <th scope="col">CPF</th>
                                    <th scope="col">Telefone</th>
                                    <th scope="col">Endereço Completo</th>
                                    <th scope="col" class="text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Iteração Thymeleaf para listar os clientes -->
                                <tr th:each="cliente : ${clientes}">
                                    <td class="px-4 fw-medium" th:text="${cliente.nome}"></td>
                                    <td th:text="${cliente.email}"></td>
                                    <!-- Aplica uma formatação de fonte monoespaçada (indicada para documentos/números) -->
                                    <td class="font-monospace text-muted" th:text="${cliente.cpf}"></td>
                                    <td th:text="${cliente.telefone}"></td>
                                    
                                    <!-- Concatenação do endereço completo usando literais do Thymeleaf (|...|) -->
                                    <td class="small" th:text="|${cliente.logradouro}, ${cliente.numero ?: 'S/N'} ${cliente.complemento ?: ''} - ${cliente.bairro}, ${cliente.cidade}/${cliente.uf} - CEP: ${cliente.cep}|">
                                    </td>
                                    
                                    <td class="text-center">
                                        <div class="btn-group" role="group">
                                            <!-- Botão de Editar apontando para o form.html -->
                                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                                <i class="bi bi-pencil-square"></i> Editar
                                            </a>
                                            
                                            <!-- Botão de Excluir apontando para a nova tela delete.html -->
                                            <a th:href="@{/clientes/deletar/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-danger" title="Excluir">
                                                <i class="bi bi-trash"></i> Excluir
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                
                                <!-- Mensagem exibida caso a tabela esteja vazia no banco -->
                                <tr th:if="${#lists.isEmpty(clientes)}">
                                    <td colspan="6" class="text-center py-4 text-muted">
                                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                        Nenhum cliente cadastrado no sistema.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Importando o JS do Bootstrap para fazer o Alerta funcionar (botão de fechar) -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
